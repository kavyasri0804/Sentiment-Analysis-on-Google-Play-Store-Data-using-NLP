<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        form {
            margin-top: 20px;
        }
        textarea {
            width: 50%;
            height: 100px;
        }
        button {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
        }
        h3 {
            margin-top: 20px;
            color: blue;
        }
    </style>
</head>
<body>

    <h1>Sentiment Analysis</h1>
    <form action="/sentiment" method="post">
        <textarea name="review" placeholder="Enter your review..."></textarea><br>
        <button type="submit">Analyze Sentiment</button>
    </form>
    
    {% if sentiment %}
        <h3>{{ sentiment }}</h3>
    {% endif %}

</body>
</html>
