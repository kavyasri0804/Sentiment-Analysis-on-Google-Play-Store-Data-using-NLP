<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📞 Contact Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-image: url('{{ url_for('static', filename='inp1.jpg') }}');
            background-size: cover;
            background-position: center;
            color: white;
        }
        h2 {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6600, #ffcc00);
            -webkit-background-clip: text;
            color: transparent;
        }
        p {
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
        }
        .name { color: #ff5733; }
        .contact { color: #33ff57; }
        .location { color: #3385ff; }
        button {
            padding: 15px 30px;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff5733, #ffcc00);
            color: white;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.3);
            transition: 0.3s ease-in-out;
        }
        button:hover {
            background: linear-gradient(45deg, #ffcc00, #ff5733);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <h2>📌 Contact Information</h2>
    
    <p class="name">👤 <strong>Name:</strong>Kavya</p>
    <p class="contact">📞 <strong>Contact:</strong> +91 9891681361</p>
    <p class="location">📍 <strong>Location:</strong> Andhra Pradesh</p>

    <br>
    <button onclick="location.href='/'">🏠 Return to Home</button>

</body>
</html>
