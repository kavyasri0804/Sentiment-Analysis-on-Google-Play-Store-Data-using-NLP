<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis</title>
</head>
<body>

<h1>Sentiment Analysis</h1>

<form action="/sentiment" method="post">
    <textarea name="review" placeholder="Enter your review" required></textarea><br><br>
    <button type="submit">Analyze</button>
</form>

{% if sentiment %}
    <h2>Predicted Sentiment: {{ sentiment }}</h2>
{% endif %}

</body>
</html>
